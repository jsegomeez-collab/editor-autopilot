# Perfil de ejemplo. Cópialo a perfiles/<marca>/ para crear una marca nueva.
identidad:
  nombre: "Marca de ejemplo"
  idioma: es-ES            # es-ES | es-LatAm
  plataformas: [instagram, tiktok, youtube_shorts]

colores:
  fondo: "#0E0E10"
  primario: "#FFFFFF"
  acentos: ["#FFB800"]     # máximo 2

tipografias:               # rutas relativas a esta carpeta
  titulares:  { archivo: fuentes/Coolvetica.otf, familia: "Coolvetica" }
  subtitulos: { archivo: fuentes/Coolvetica.otf, familia: "Coolvetica" }
  respaldo:   { archivo: fuentes/Inter-Bold.ttf, familia: "Inter" }

logo:
  archivo: logo/logo.png
  uso: solo_cta            # nunca al inicio

ritmo: rapido              # rapido | natural

layout:
  patron: split-hook-oscilante
  transicion: corte        # corte | push

subtitulos:
  estilos_permitidos: [caja, contorno]
  estilo_por_defecto: caja

audio:
  musica: true
  estados_animo_permitidos: [energetica, inspiradora, tension, neutra, emocional]
  estado_animo_por_defecto: neutra
  sfx: true
  estilo_sfx: minimal      # minimal | energetico
  densidad_sfx: media      # baja | media | alta
  niveles:
    voz_lufs: -14
    musica_db_bajo_voz: 20   # 18–22
    sfx_db_bajo_pico_voz: 6  # ≥ 6

cta_por_defecto: "Comenta PISO"
ctas_alternativos: ["Guárdalo para luego", "Sígueme para más"]

duracion_objetivo_max_s: 90

muletillas_extra: []
palabras_a_no_cortar: []

zonas_seguras: { superior: 220, inferior: 380, derecha: 120 }

plantillas_permitidas: [gancho, cifra, lista, comparativa, pasos, pregunta, palabra_clave, alerta, grafico, cta]

<!doctype html>
<!-- Plantilla "cifra": contador animado de un número ($, € o %). Cuenta desde 0 y aterriza
     exactamente en t_aterrizaje; al llegar, golpe de escala y la cifra pasa al color de acento.
     Después aparece la etiqueta. Panel split 1080x960 opaco. render_plantillas.py sustituye
     data-duration y pasa las variables. -->
<html lang="es" data-composition-variables='[
  {"id":"fondo","type":"color","label":"Fondo","default":"#121827"},
  {"id":"primario","type":"color","label":"Texto","default":"#FFFFFF"},
  {"id":"acento","type":"color","label":"Acento","default":"#FFDB00"},
  {"id":"duracion","type":"number","label":"Duración (s)","default":3},
  {"id":"datos","type":"string","label":"Datos (JSON)","default":"{\"valor\":30000,\"prefijo\":\"$\",\"etiqueta\":\"al mes con IA\",\"t_aterrizaje\":1.2}"}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=960" />
  <link rel="stylesheet" href="_comun/base.css" />
  <script src="_comun/gsap.min.js"></script>
  <style>
    #contenido {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; text-align: center; transform-origin: 50% 50%;
    }
    #cifra {
      font-family: "Titulares", sans-serif; line-height: 1; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--primario);
      transform-origin: 50% 55%;
    }
    #pie { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    #linea { width: 96px; height: 8px; border-radius: 4px; background: var(--acento); }
    #etiqueta {
      font-family: "Texto", sans-serif; line-height: 1.1; letter-spacing: -0.01em;
      color: color-mix(in srgb, var(--primario) 85%, transparent); max-width: 860px;
    }
    .resplandor { left: 90px; top: 40px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="960">
    <div class="resplandor clip" id="resplandor" data-start="0" data-duration="3"></div>
    <div class="util clip" id="contenido" data-start="0" data-duration="3">
      <div id="cifra"></div>
      <div id="pie"><div id="linea"></div><div id="etiqueta"></div></div>
    </div>
  </div>
  <script src="_comun/base.js"></script>
  <script>
    const { valor, prefijo = "", sufijo = "", decimales = 0, etiqueta = "", t_aterrizaje = 1 } = HF.datos;

    /* Formato es-LatAm: miles con "." desde 10.000, decimal con ",". */
    function formatear(v) {
      const fijo = Math.abs(v).toFixed(decimales);
      let [entero, fraccion] = fijo.split(".");
      if (entero.length >= 5) entero = entero.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return (v < 0 ? "-" : "") + entero + (fraccion ? "," + fraccion : "");
    }
    const texto = (v) => prefijo + formatear(v) + sufijo;

    const cifra = document.getElementById("cifra");
    const pie = document.getElementById("pie");
    const etq = document.getElementById("etiqueta");

    // Tamaño fijo según el texto final (sin medir el DOM): cifras ≈ 0,66 em de ancho.
    const final = texto(valor);
    cifra.style.fontSize = Math.round(Math.min(250, 860 / (final.length * 0.66))) + "px";
    if (etiqueta) {
      etq.textContent = etiqueta;
      etq.style.fontSize = HF.tamanoTexto(etiqueta, 860, 130, 60, 36) + "px";
    } else {
      pie.style.display = "none";
    }

    // Contador: GSAP escribe en la propiedad "v" y el setter pinta el texto ya formateado.
    // (No depende de callbacks, que el seek puede suprimir.)
    const contador = {
      _v: 0,
      get v() { return this._v; },
      set v(x) { this._v = x; cifra.textContent = texto(x); },
    };
    contador.v = 0;

    const tl = gsap.timeline({ paused: true });
    const t = HF.limitar(t_aterrizaje);
    const conteo = Math.min(1.0, t);            // 0,8–1,2 s cuando hay margen
    const inicio = t - conteo;

    if (conteo > 0) {
      tl.fromTo(cifra, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: Math.min(0.35, conteo), ease: HF.EASE_ENTRADA }, inicio);
      tl.fromTo(contador, { v: 0 }, { v: valor, duration: conteo, ease: "power2.out" }, inicio);
      // La cifra se tiñe de acento justo al aterrizar.
      tl.fromTo(cifra, { color: HF.color("primario") }, { color: HF.color("acento"), duration: Math.min(0.25, conteo), ease: HF.EASE_ENTRADA }, t - Math.min(0.25, conteo));
    } else {
      contador.v = valor;
      tl.set(cifra, { color: HF.color("acento") }, 0);
    }
    // Golpe de escala al llegar.
    tl.to(cifra, { scale: 1.1, duration: 0.12, ease: HF.EASE_ENTRADA }, t);
    tl.to(cifra, { scale: 1, duration: 0.3, ease: HF.EASE_SUAVE }, t + 0.12);

    // Otro elemento: la etiqueta, después del golpe.
    if (etiqueta) HF.revelar(tl, pie, t + 0.5, { y: 30 });

    // Deriva sutil: el panel nunca queda estático.
    tl.fromTo("#resplandor", { x: -30, y: 20, scale: 0.9 }, { x: 40, y: -20, scale: 1.05, duration: HF.duracion, ease: HF.EASE_SUAVE }, 0);
    HF.deriva(tl, "#contenido");
    HF.registrar(tl);
  </script>
</body>
</html>

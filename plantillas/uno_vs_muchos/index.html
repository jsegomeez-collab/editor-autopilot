<!doctype html>
<!-- Plantilla "uno_vs_muchos": una persona que hace el trabajo de muchos. Figura central de la que
     salen, de una en una, líneas hacia las tareas/herramientas (iconos en órbita); al aterrizar,
     un contador «x10» en acento. Panel split 1080x960 opaco. SVG en línea en la variable "svgs". -->
<html lang="es" data-composition-variables='[
  {"id":"fondo","type":"color","label":"Fondo","default":"#121827"},
  {"id":"primario","type":"color","label":"Texto","default":"#FFFFFF"},
  {"id":"acento","type":"color","label":"Acento","default":"#FFDB00"},
  {"id":"duracion","type":"number","label":"Duración (s)","default":3},
  {"id":"datos","type":"string","label":"Datos (JSON)","default":"{\"icono_persona\":\"user\",\"iconos\":[\"mail\",\"calendar\",\"chart-column\",\"message-circle\",\"receipt\"],\"cantidad\":10,\"rotulo\":\"una sola persona\",\"t_aterrizaje\":1.4}"},
  {"id":"svgs","type":"string","label":"SVG en línea (JSON)","default":"{}"}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=960" />
  <link rel="stylesheet" href="_comun/base.css" />
  <script src="_comun/gsap.min.js"></script>
  <style>
    #escena { transform-origin: 50% 50%; }
    #red { position: absolute; left: 0; top: 0; width: 900px; height: 620px; overflow: visible; }
    #red line { stroke: color-mix(in srgb, var(--primario) 38%, transparent); stroke-width: 2.5; stroke-linecap: round; }
    #red circle.pulso { fill: var(--acento); filter: drop-shadow(0 0 6px var(--acento)); opacity: 0; }
    #red circle.orbita { fill: none; stroke: color-mix(in srgb, var(--primario) 14%, transparent); stroke-width: 2; stroke-dasharray: 4 14; }
    .nodo {
      position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--fondo) 60%, #000);
      border: 1.5px solid color-mix(in srgb, var(--primario) 22%, transparent);
      box-shadow: 0 0 34px color-mix(in srgb, var(--acento) 14%, transparent);
    }
    .icono {
      color: var(--primario); stroke-width: 1.6; overflow: visible;
      filter: drop-shadow(0 0 12px color-mix(in srgb, var(--acento) 45%, transparent));
    }
    .nodo .icono { width: 60px; height: 60px; }
    #figura {
      position: absolute; width: 210px; height: 210px; margin: -105px 0 0 -105px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--fondo) 55%, #000);
      border: 3px solid var(--acento);
      box-shadow: 0 0 60px color-mix(in srgb, var(--acento) 35%, transparent),
                  inset 0 0 30px color-mix(in srgb, var(--acento) 12%, transparent);
    }
    #figura .icono { width: 124px; height: 124px; stroke-width: 1.5; }
    #onda {
      position: absolute; width: 210px; height: 210px; margin: -105px 0 0 -105px; border-radius: 50%;
      border: 3px solid var(--acento); opacity: 0;
    }
    #contador {
      position: absolute; height: 84px; padding: 0 22px; margin-top: -42px; border-radius: 42px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Titulares", sans-serif; font-size: 62px; line-height: 1; letter-spacing: -0.02em;
      color: var(--fondo); background: var(--acento);
      box-shadow: 0 0 40px color-mix(in srgb, var(--acento) 60%, transparent);
    }
    #rotulo {
      position: absolute; left: 0; width: 900px; text-align: center;
      font-family: "Titulares", sans-serif; line-height: 1.05; letter-spacing: -0.01em;
    }
    .resplandor { left: 60px; top: 30px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="960">
    <div class="resplandor clip" id="resplandor" data-start="0" data-duration="3"></div>
    <div class="util clip" id="escena" data-start="0" data-duration="3">
      <svg id="red" viewBox="0 0 900 620"></svg>
    </div>
  </div>
  <script src="_comun/base.js"></script>
  <script>
    const { icono_persona = "user", iconos = [], cantidad, rotulo = "", t_aterrizaje = 1 } = HF.datos;
    const escena = document.getElementById("escena");
    const red = document.getElementById("red");
    const NS = "http://www.w3.org/2000/svg";
    const tl = gsap.timeline({ paused: true });
    const t = HF.limitar(t_aterrizaje);
    const n = iconos.length;

    // Geometría fija (coordenadas del área útil 900x620). Márgenes de ≥ 10 px para la deriva.
    const CX = 450, CY = rotulo ? 268 : 310;
    const RX = 330, RY = rotulo ? 196 : 234;
    const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / n + (n % 2 === 0 ? Math.PI / n : 0);
    const pos = iconos.map((_, i) => ({ x: CX + RX * Math.cos(ang(i)), y: CY + RY * Math.sin(ang(i)) }));

    // Órbita tenue.
    const orb = document.createElementNS(NS, "ellipse");
    Object.entries({ cx: CX, cy: CY, rx: RX, ry: RY }).forEach(([k, v]) => orb.setAttribute(k, v));
    orb.style.cssText = "fill:none;stroke:color-mix(in srgb, var(--primario) 12%, transparent);stroke-width:2;stroke-dasharray:4 14";
    red.appendChild(orb);

    // Líneas del centro a cada tarea (del borde de la figura al borde del nodo).
    const lineas = pos.map((p) => {
      const dx = p.x - CX, dy = p.y - CY, d = Math.hypot(dx, dy);
      const l = document.createElementNS(NS, "line");
      const a = 112 / d, b = (d - 64) / d;
      l.setAttribute("x1", CX + dx * a); l.setAttribute("y1", CY + dy * a);
      l.setAttribute("x2", CX + dx * b); l.setAttribute("y2", CY + dy * b);
      red.appendChild(l);
      l._largo = Math.ceil(d * (b - a)) + 1;
      return l;
    });

    // Nodos de tareas.
    const nodos = iconos.map((nombre, i) => {
      const el = document.createElement("div");
      el.className = "nodo";
      el.style.left = pos[i].x + "px";
      el.style.top = pos[i].y + "px";
      el.appendChild(HF.svg(nombre));
      escena.appendChild(el);
      return el;
    });

    // Figura central (la persona) y su onda.
    const onda = document.createElement("div");
    onda.id = "onda";
    Object.assign(onda.style, { left: CX + "px", top: CY + "px" });
    escena.appendChild(onda);
    const fig = document.createElement("div");
    fig.id = "figura";
    Object.assign(fig.style, { left: CX + "px", top: CY + "px" });
    const persona = HF.svg(icono_persona);
    fig.appendChild(persona);
    escena.appendChild(fig);

    // Contador «x10» (insignia centrada bajo la figura, montada sobre su borde).
    let cont = null;
    if (cantidad != null) {
      cont = document.createElement("div");
      cont.id = "contador";
      Object.assign(cont.style, { left: CX + "px", top: CY + 122 + "px" });
      gsap.set(cont, { xPercent: -50 });
      escena.appendChild(cont);
    }

    // Rótulo (≤ 4 palabras) bajo la escena.
    let rot = null;
    if (rotulo) {
      rot = document.createElement("div");
      rot.id = "rotulo";
      rot.style.fontSize = HF.tamanoTexto(rotulo, 860, 64, 58, 36) + "px";
      rot.style.top = "548px";
      rot.textContent = rotulo;
      escena.appendChild(rot);
    }

    // ---- Tiempos: figura → tareas de una en una → contador exactamente en t ----
    const pre = Math.min(t, 0.45 + n * 0.17);     // tiempo total de la preparación
    const tFig = Math.max(0, t - pre);
    const paso = n ? Math.max(0, pre - 0.3) / n : 0;
    const tNodo = (i) => Math.min(t, tFig + 0.1 + paso * (i + 1));

    // Figura: se dibuja y crece.
    HF.dibujar(tl, persona, tFig, 0.5);
    if (tFig > 0) tl.fromTo(fig, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: Math.min(0.4, tFig), ease: "power2.out" }, tFig - Math.min(0.4, tFig));

    // La órbita aparece con la figura.
    if (tFig > 0) tl.fromTo(orb, { opacity: 0 }, { opacity: 1, duration: Math.min(0.4, tFig), ease: "power2.out" }, tFig - Math.min(0.4, tFig));

    // Cada tarea: la línea sale de la figura y el nodo aparece al final de ella.
    nodos.forEach((nodo, i) => {
      const fin = tNodo(i);
      const l = lineas[i];
      l.style.strokeDasharray = l._largo;
      const dL = Math.min(0.25, fin), dN = Math.min(0.28, fin);
      if (fin > 0) {
        tl.fromTo(l, { strokeDashoffset: l._largo }, { strokeDashoffset: 0, duration: dL, ease: "power2.out" }, fin - dL - 0.08 > 0 ? fin - dL - 0.08 : 0);
        tl.fromTo(nodo, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: dN, ease: "power2.out" }, fin - dN);
      } else l.style.strokeDashoffset = 0;
      HF.dibujar(tl, nodo.querySelector("svg"), fin, 0.35);
      // Destello de acento en el trazo al conectarse.
      tl.fromTo(nodo.querySelector("svg"), { color: HF.color("acento") }, { color: HF.color("primario"), duration: 0.45, ease: "power2.inOut" }, fin);

      // Flujo de trabajo: un pulso viaja de la persona a la tarea, en bucle con tiempos fijos.
      const pul = document.createElementNS(NS, "circle");
      pul.setAttribute("class", "pulso");
      pul.setAttribute("r", 6);
      red.appendChild(pul);
      const x1 = +l.getAttribute("x1"), y1 = +l.getAttribute("y1"), x2 = +l.getAttribute("x2"), y2 = +l.getAttribute("y2");
      for (let k = fin + 0.05 + (i % 3) * 0.12; k + 0.55 < HF.duracion; k += 0.75) {
        tl.fromTo(pul, { attr: { cx: x1, cy: y1 }, opacity: 1 }, { attr: { cx: x2, cy: y2 }, opacity: 0.2, duration: 0.55, ease: "power2.inOut", immediateRender: false }, k);
      }
    });

    // Aterrizaje principal en t: contador que sube hasta «xN» + onda de acento desde la figura.
    if (cont) {
      const c = { v: 1 };
      const pintar = () => { cont.textContent = "x" + Math.round(c.v); };
      const d = Math.min(0.45, t);
      if (d > 0) {
        tl.fromTo(cont, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: Math.min(0.25, d), ease: "power2.out" }, t - d);
        tl.fromTo(c, { v: 1 }, { v: cantidad, duration: d, ease: "power2.out", onUpdate: pintar }, t - d);
        tl.fromTo(cont, { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      } else c.v = cantidad;
      pintar();
    }
    tl.fromTo(onda, { scale: 1, opacity: 0.9 }, { scale: 2.1, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, t);
    tl.fromTo(persona, { color: HF.color("acento") }, { color: HF.color("primario"), duration: 0.6, ease: "power2.inOut", immediateRender: t === 0 }, t);
    if (rot) HF.revelar(tl, rot, HF.limitar(t + 0.3), { y: 24 });

    // Vida constante: órbita que gira despacio, resplandor que deriva, leve escala.
    tl.fromTo(orb, { strokeDashoffset: 0 }, { strokeDashoffset: -120, duration: HF.duracion, ease: "power2.inOut" }, 0);
    tl.fromTo(fig, { y: 0 }, { y: -6, duration: HF.duracion, ease: "power2.inOut", immediateRender: false }, 0);
    tl.fromTo("#resplandor", { x: -40, y: 0 }, { x: 50, y: 40, duration: HF.duracion, ease: HF.EASE_SUAVE }, 0);
    HF.deriva(tl, "#escena");
    HF.registrar(tl);
  </script>
</body>
</html>
